<!--
  Phase 2 checkpoint quiz for rhyme-schemer (Units 5-8: the rhyme kernel).
  Same self-checking template as phase-1: immediate explanatory feedback on
  every option; distractors target specific misconceptions.
  No localStorage; in-memory only.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 2 Checkpoint — The Rhyme Kernel</title>
<link rel="stylesheet" href="../../site/style.css">
<script>(function(){try{var t=localStorage.getItem("rs-theme");
if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
  /* The course stylesheet (../../site/style.css) carries the palette, the
     faces, and the type ramp. What follows is only this page's mechanics,
     expressed in those tokens -- no local hexes, so light and dark both
     work and the quiz matches the lesson that sent you here. */
  :root{--ok:var(--hue-1);--no:var(--hue-5);--accent:var(--hue-0);}
  .wrap{max-width:44rem;margin:0 auto;padding:2.4rem 1.25rem 5rem;}
  h1{font-size:1.6rem;margin:0 0 .25rem;letter-spacing:-.022em;}
  .sub{color:var(--ink-muted);font-size:1.02rem;margin:0 0 1.9rem;line-height:1.5;}
  .q{background:var(--surface-raised);border:1px solid var(--rule);
     border-radius:var(--radius);padding:1.3rem 1.4rem;margin:0 0 1rem;}
  .q h2{font-size:1.1rem;margin:0 0 .9rem;font-weight:640;letter-spacing:-.015em;}
  .q h2::before{display:none;}
  .opt{display:block;width:100%;text-align:left;padding:.7rem .9rem;margin:.5rem 0;
     background:var(--surface);color:var(--ink-body);border:1px solid var(--rule);
     border-radius:var(--radius-sm);cursor:pointer;font:inherit;font-size:1rem;
     transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-raised);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);
     background:color-mix(in srgb,var(--ok) 13%,var(--surface));}
  .opt.wrong{border-color:var(--no);
     background:color-mix(in srgb,var(--no) 13%,var(--surface));}
  .why{font-size:.95rem;color:var(--ink-muted);margin:.45rem .2rem 0;
     padding-left:.9rem;border-left:2px solid var(--rule-strong);
     display:none;line-height:1.55;}
  .why.show{display:block;}
  .score{position:sticky;bottom:0;background:var(--surface-raised);
     border:1px solid var(--rule-strong);border-radius:var(--radius);
     padding:.9rem 1.15rem;margin-top:.5rem;font-family:var(--sans);
     font-size:.9rem;font-weight:650;box-shadow:var(--shadow);}
</style>
</head>
<body>
<div class="toolbar"><div class="toolbar-in">
    <a class="back" href="../../site/unit-08.html">Unit 8</a>
    <a class="brand" href="../../site/index.html">rhyme-schemer <span>&middot; the course</span></a>
    <button class="theme" type="button" id="theme-toggle"
      aria-label="Switch between light and dark">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.2v2M12 19.8v2M2.2 12h2M19.8 12h2M4.9 4.9l1.4 1.4
        M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.2 8.2 0 1 0 10.5 10.5z"/></svg>
    </button>
</div></div>
<div class="wrap">
  <h1>Phase 2 Checkpoint — The Rhyme Kernel</h1>
  <p class="sub">Units 5–8. Click an answer to see why every option is right or wrong.</p>
  <div id="quiz"></div>
  <div class="score" id="score"></div>
</div>
<script>
const QUIZ_DATA=[
 {q:"‘Lessen’ and ‘strengthen’ share their final syllable yet don’t rhyme. What does <code>rhyme_tail</code> get right that ‘compare the last syllable’ gets wrong?",
  options:[
   {text:"The tail starts at the last PRIMARY-stressed syllable, so their tails begin at very different stressed material",correct:true,why:"Right — rhyme anchors at the last stress. The shared unstressed ‘-en’ was never the rhyme-bearing part."},
   {text:"The tail excludes unstressed syllables entirely",correct:false,why:"No — unstressed syllables AFTER the last stress stay in the tail (reason/season rhyme across two syllables, one unstressed)."},
   {text:"The tail is always exactly one syllable",correct:false,why:"No — the tail runs from the last primary stress to the END, however many syllables that is."}]},
 {q:"A pronunciation has no primary stress anywhere. What does <code>rhyme_tail</code> return?",
  options:[
   {text:"An empty tuple — no stress, no rhyme",correct:false,why:"No: a scorer that returns nothing for reduced function words would crash downstream. There’s a fallback cascade."},
   {text:"From the last SECONDARY stress if any, else the final syllable alone",correct:true,why:"Right — the cascade: primary, else secondary, else the word’s end (the most rhyme-like thing left)."},
   {text:"The whole pronunciation",correct:false,why:"Only when the FIRST syllable carries the last primary. Stressless words fall back to the final syllable, not everything."}]},
 {q:"Why is the nucleus/coda blend divided by the total weight — <code>(w_n·nuc + w_c·coda)/(w_n + w_c)</code>?",
  options:[
   {text:"To keep the arithmetic from overflowing",correct:false,why:"Overflow isn’t a concern with these magnitudes. The normalization has a calibration purpose."},
   {text:"So identical syllables score exactly 1.0 no matter how the weights are set",correct:true,why:"Right — perfect rhyme stays pinned at the top of the scale while the weights stay freely tunable. Load-bearing for Unit 14’s sweep."},
   {text:"Because similarity values must always be averaged in pairs",correct:false,why:"It’s not a rule about averages — it’s specifically what keeps 1.0 stable under retuning."}]},
 {q:"The gap penalty (0.6) must sit in a specific band. What breaks if it’s <em>below</em> a near-vowel substitution (~0.15)?",
  options:[
   {text:"Genuine extra syllables can’t be skipped",correct:false,why:"That’s the failure at the OTHER end (penalty too high forces bad pairings)."},
   {text:"The aligner prefers gap-pairs over real matches — everything aligns to nothing and scores collapse",correct:true,why:"Right — if skipping is cheaper than matching near-vowels, the cheapest path shreds real correspondences into gaps."},
   {text:"Equal-length tails stop aligning on the diagonal",correct:false,why:"Diagonal preference on ties handles that; the too-low failure is gap-shredding of genuine matches."}]},
 {q:"On ties, the alignment recurrence prefers the diagonal (substitution). What does that buy?",
  options:[
   {text:"Faster table filling",correct:false,why:"Tie-breaking order doesn’t change complexity."},
   {text:"Equal-length tails stay gap-free, so Unit 6’s position-by-position scores are reproduced exactly",correct:true,why:"Right — alignment must GENERALIZE the old scorer, not perturb it. The parity tests pin this."},
   {text:"Gaps become impossible",correct:false,why:"Gaps still happen whenever lengths differ or a substitution is dear — ties just don’t introduce spurious ones."}]},
 {q:"Why does <code>align_tails</code> return the backtraced columns instead of just the final score?",
  options:[
   {text:"The pairing is needed downstream: coda scoring runs per matched column, and visualization must show which syllables rhymed",correct:true,why:"Right — a DP without a backtrace answers ‘how good’ but never ‘which.’ Build the backtrace now, not later."},
   {text:"The score can’t be computed without materializing all columns",correct:false,why:"It can — the corner cell holds the optimal cost. The columns are returned because callers need the pairing itself."},
   {text:"Returning columns makes the function faster",correct:false,why:"The backtrace is extra work, not a speedup — it’s done because the pairing is load-bearing."}]},
 {q:"ALINE names an explicit salience weight for every feature it consults. Which weight in our vowel space exists only as a structural choice?",
  options:[
   {text:"The rhotic flag’s weight",correct:false,why:"_W_RHOTIC is explicit — a named constant. The hidden one is inside the plane metric."},
   {text:"The nucleus:coda weighting",correct:false,why:"That one is explicit — DEFAULT_NUCLEUS_WEIGHT and DEFAULT_CODA_WEIGHT are named constants in rhyme.py, sweepable today."},
   {text:"The backness:height ratio — Euclidean distance fixes it at 1:1 silently, so no sweep can move it",correct:true,why:"Right — a deliberate default, not a finding. The knob must be made to exist before Unit 14 can sweep it (features.py says so)."}]},
 {q:"The sky / fire / higher triangle scores 0.500 / 0.741 / 1.000 for one perceptual relation. What steers the three numbers apart?",
  options:[
   {text:"CMUdict variant coverage: ‘fire’ happens to have a monosyllabic reading, ‘higher’ doesn’t — plus the flat gap penalty for the rest",correct:true,why:"Right — dictionary accidents plus a flat gap where ALINE would offer graded compression. Ledger item 10; variants-first is the decided direction."},
   {text:"The three pairs genuinely differ that much to the ear",correct:false,why:"The learner’s recorded ear data disagrees: fire~higher is perfect, sky~fire an acceptable slant — the 0.500 is mechanism, not perception."},
   {text:"A bug in the alignment recurrence",correct:false,why:"The alignment is correct — the issue is representational (no compression op) and lexical (uneven variants), not a coding error."}]},
];
const quizEl=document.getElementById('quiz'),scoreEl=document.getElementById('score');
let answered=0,correct=0;
QUIZ_DATA.forEach((item,qi)=>{
 const card=document.createElement('div');card.className='q';
 const h=document.createElement('h2');h.innerHTML=(qi+1)+'. '+item.q;card.appendChild(h);
 let locked=false;
 item.options.forEach((opt)=>{
  const btn=document.createElement('button');btn.className='opt';btn.innerHTML=opt.text;
  const why=document.createElement('div');why.className='why';why.textContent=opt.why;
  btn.addEventListener('click',()=>{
   if(locked)return;locked=true;answered++;if(opt.correct)correct++;
   Array.from(card.querySelectorAll('.opt')).forEach((b,i)=>{b.disabled=true;if(item.options[i].correct)b.classList.add('correct');});
   if(!opt.correct)btn.classList.add('wrong');
   card.querySelectorAll('.why').forEach(w=>w.classList.add('show'));
   scoreEl.textContent='Answered '+answered+' / '+QUIZ_DATA.length+'  ·  '+correct+' correct';
  });
  card.appendChild(btn);card.appendChild(why);
 });
 quizEl.appendChild(card);
});
scoreEl.textContent='Answered 0 / '+QUIZ_DATA.length;
</script>
<script src="../../site/course.js"></script>
</body>
</html>
