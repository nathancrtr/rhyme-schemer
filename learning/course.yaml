# ---- Tier 4 — culture & motivation ----
- key: pudding
  tier: 4
  title: "The Pudding — hip-hop lyric visualizations"
  cite: "Matt Daniels · The Pudding"
  formats: [TOOL]
  cost: "free"
  free: true
