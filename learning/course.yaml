# Sidecar for the rhyme-schemer course (project-driven mode).
# Unit->material bindings transcribed from learning/build_site.py's UNITS dict,
# which this file supersedes as the structural source of truth.
# Resources structured from learning/learning-resources.md (which remains the
# prose shelf); tier layout follows that document's own section organization.
sidecar_version: 1
course:
  id: rhyme-schemer
  title: "NLP & computational phonology, by finishing rhyme-schemer"
  mode: project
  hours_per_week: [3, 5]
  docs:
    readme: learning/README.md
    resources_doc: learning/learning-resources.md
    curriculum_doc: learning/curriculum.md
    review: REVIEW.md
  capstone: u15
  coverage_ignore:
    - interactive/widgets/generate_sandbox_lexicon.py   # data generator, not a material
  resources_intro: >-
    A reference shelf, not a syllabus — `curriculum.md` says *when* to read
    what. **Tier 1** is the core path: read substantially, these four carry
    the course. **Tier 2** deepens and offers alternatives, consulted as a
    unit demands. **Tier 3** is reference & practice — look things up, read
    source. **Tier 4** is culture & motivation. Every link was checked live
    in June 2026; entries marked *(added July 2026)* come from the external
    research review in `REVIEW.md`, itself worth reading as a map of where
    this project sits in the field.
  reading_order:
  - "Get the repo running: pip install -r requirements.txt; python -m unittest discover tests — all green"
  - "Skim the Hirjee & Brown 2009 intro and one Pudding piece — know what you're building toward"
  - "Play with pronouncing in a REPL and the interactive IPA chart — get the data and the sounds under your fingers"
  - "Read phonetics.py and features.py alongside the SLP3 Phonetics chapter"
  - "Then open curriculum.md and start Phase 1"

resources:
# ---- Tier 1 — the core path ----
- key: jm
  tier: 1
  title: "Speech and Language Processing (3rd ed.)"
  cite: "Jurafsky & Martin · free draft · Jan 2025 release"
  formats: [TEXT]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["Free draft (Stanford)", "https://web.stanford.edu/~jurafsky/slp3"]
  why_this_one: >-
    *The* computational-linguistics textbook, written by a computational
    linguist, and the single best map of the whole field. You already know it
    from your ML/AI shelf — here you'll mine specific chapters rather than
    read cover-to-cover. It supplies the formal backbone for three pillars of
    rhyme-schemer: the **Phonetics** chapter (articulatory phonetics, the IPA,
    ARPAbet — exactly what `phonetics.py` and `features.py` encode), the
    **Minimum Edit Distance** section of Ch. 2 (the alignment algorithm you'll
    need to compare vowel skeletons of unequal length), and **Vector Semantics
    & Embeddings** (Ch. 6), which reframes your feature-distance metric as a
    baby embedding — the conceptual bridge to your ML interests.
  access_note: "Chapter numbers drift between drafts; navigate by title from the index page."
- key: hb
  tier: 1
  title: "Automatic Detection of Internal and Imperfect Rhymes in Rap Lyrics"
  cite: "Hirjee & Brown · ISMIR · 2009"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["ISMIR 2009 (PDF)", "https://ismir2009.ismir.net/proceedings/OS8-1.pdf"]
  - ["Hirjee's thesis, Rhyme, Rhythm, and Rhubarb (UWSpace — search the title)", "https://uwspace.uwaterloo.ca/items"]
  why_this_one: >-
    This is rhyme-schemer's prior art — the paper that did this exact task and
    did it well. They score *imperfect* (slant) rhymes with a
    phoneme-similarity matrix learned from real rap lyrics, then detect
    internal and line-final rhymes. Reading it tells you which design
    decisions in the repo are standard practice (phoneme features, scoring
    over the rhyming tail) and which are your own simplifications (hand-placed
    coordinates instead of a learned matrix). It is the benchmark your
    finished tool should be measured against.
  covers: >-
    Deeper companions: *Using Automated Rhyme Detection to Characterize
    Rhyming Style in Rap Music* (Empirical Musicology Review 5(4):121–145,
    2010) and Hirjee's full thesis *Rhyme, Rhythm, and Rhubarb* expand the
    method and the evaluation. The thesis's annotated lyrics were the field's
    benchmark — an evaluation resource for Unit 14, and using them makes
    results directly comparable to the named prior art.
  access_note: >-
    Field note *(added July 2026)*: their work was never displaced for this
    task, but it also wasn't extended — today it is cited mostly as the source
    of the **rhyme density** metric used to evaluate rap *generation* (e.g.
    DopeLearning, Malmi et al. KDD 2016:
    https://arxiv.org/abs/1505.04771). rhyme-schemer is one of very few
    active successors to their actual detection program.
- key: parrish
  tier: 1
  title: "Allison Parrish — pronouncing + phonetic-similarity work"
  cite: "Allison Parrish · library, teaching notes & AAAI 2017 paper"
  formats: [CODE, PAPER]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["pronouncing docs", "https://pronouncing.readthedocs.io/"]
  - ["CMUdict teaching notes", "https://github.com/aparrish/gen-text-workshop/blob/master/cmu_pronouncing_dictionary_notes.md"]
  - ["Poetic Sound Similarity Vectors Using Phonetic Features (AAAI 2017, PDF)", "https://chuck.stanford.edu/chai/data/aparrish/parrish-2017-aaai.pdf"]
  why_this_one: >-
    Parrish is the ideal bridge figure for your profile — a programmer-poet
    who turns phonemes into feature vectors for creative tools, exactly the
    spirit of this project. Her library is your data layer; her teaching notes
    are the gentlest possible on-ramp to the rhyming-tail concept — her
    `rhyming_part()` ("everything from the stressed syllable nearest the end")
    is *precisely* the vowel-skeleton idea in rhyme-schemer's roadmap, in a
    few lines of Python; her paper shows where the feature-distance approach
    goes next (full phonetic word embeddings that handle out-of-vocabulary
    words). Read the docs and notes early, the paper around Phase 2–3.
- key: ipa
  tier: 1
  title: "A first look at articulatory phonetics — the IPA, hands-on"
  cite: "ipachart.com + the Wikipedia reference charts"
  formats: [TOOL]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["Interactive IPA chart with audio", "https://www.ipachart.com/"]
  - ["IPA vowel chart (Wikipedia)", "https://en.wikipedia.org/wiki/Vowel#Vowel_chart"]
  - ["IPA vowel chart with audio (Wikipedia)", "https://en.wikipedia.org/wiki/IPA_vowel_chart_with_audio"]
  why_this_one: >-
    `features.py` places every vowel on the IPA vowel quadrilateral (height ×
    backness) and every consonant by place × manner. To trust — and tune —
    those coordinates, you need the articulatory picture in your ear and your
    mouth, not just on a grid. Spend an hour *making the sounds* while
    watching where your tongue goes. This is the one place where audio beats
    text. (The course also ships an interactive vowel-quadrilateral widget
    built from the repo's own numbers — see `interactive/widgets/`.)

# ---- Tier 2 — deepening & alternatives ----
- key: panphon
  tier: 2
  title: "panphon — IPA → articulatory feature vectors"
  cite: "Mortensen et al. · COLING · 2016"
  formats: [CODE, PAPER]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["GitHub", "https://github.com/dmort27/panphon"]
  - ["Paper (COLING 2016)", "https://aclanthology.org/C16-1328/"]
  - ["API reference", "https://github.com/dmort27/panphon#api"]
  why_this_one: >-
    The library `features.py` explicitly names as its future replacement. It
    maps 5,000+ IPA segments to 21 articulatory features and — crucially —
    its `Distance` class computes *feature-weighted edit distance*, which is
    your alignment unit (Unit 8) and your feature unit (Units 2–3) fused into
    one tool. Read its `Distance` source when you build alignment; consider
    swapping it in during the capstone.
  covers: "API: `Distance`, the feature tables, feature-edit-distance."
- key: epitran
  tier: 2
  title: "Epitran — precision grapheme-to-phoneme"
  cite: "Mortensen et al. · 2018"
  formats: [TOOL]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["GitHub", "https://github.com/dmort27/epitran"]
  why_this_one: >-
    For Unit 13 (out-of-vocabulary words). When CMUdict doesn't have a word,
    you need grapheme-to-phoneme (G2P). Epitran is a solid rule-based G2P.
  access_note: >-
    Currency note *(added July 2026)*: `g2p_en`
    (https://github.com/Kyubyong/g2p), previously listed as "the neural
    alternative," is a 2019 artifact and effectively unmaintained. The current
    neural G2P baseline is byte-level transformers — ByT5 G2P
    (https://www.isca-archive.org/interspeech_2022/zhu22_interspeech.pdf) and
    CharsiuG2P (https://github.com/lingjzhu/CharsiuG2P) — with the SIGMORPHON
    2020–22 shared tasks
    (https://aclanthology.org/2020.sigmorphon-1.13.pdf) as the benchmark
    line. For the *dialect-variant* gap CMUdict leaves (tuning-ledger item
    2), the field's answer is Wiktionary-scraped lexicons: WikiPron (Tier 3).
- key: katz
  tier: 2
  title: "The phonology of imperfect rhyme — perceptual similarity"
  cite: "Katz · Lingua 160 · 2015 — and Kawahara · J. East Asian Linguistics 16 · 2007"
  formats: [PAPER]
  verified_at: "2026-08"
  links:
  - ["Katz 2015, Hip-hop rhymes reiterate phonological typology (Lingua)", "https://www.sciencedirect.com/science/article/abs/pii/S0024384115000492"]
  - ["Katz — open repository copy (cite the Lingua venue)", "https://researchrepository.wvu.edu/cgi/viewcontent.cgi?article=2149&context=faculty_publications"]
  - ["Kawahara 2007, Half rhymes in Japanese rap lyrics (JEAL)", "https://link.springer.com/article/10.1007/s10831-007-9009-1"]
  why_this_one: >-
    The deep "why" behind the whole feature-distance bet. These studies find
    that the imperfect rhymes rappers actually use track **perceptual
    similarity** between sounds — the empirical justification for modeling
    rhyme as distance in an articulatory space rather than as exact match.
    Read when you start tuning weights (Unit 7) and want to know what
    "correct" even means. (Background: Steriade's P-map.)
  covers: >-
    Use them as data, not just motivation — but as *consonant* data *(note
    added July 2026; corrected August 2026)*: verified against the papers,
    Katz's method keys rhyme detection on matched vowel quality ("with no
    reference to consonantal properties"), so his correspondence counts
    measure **consonant** mismatches (place/voicing/continuancy, by context)
    with vowels held fixed by construction; Kawahara's half-rhyme statistics
    are likewise consonant pairs (in a five-vowel language). What they *can*
    audit empirically is the **consonant** plane — e.g. Katz finds place
    mismatches among nasals dramatically cheaper than among oral stops, an
    asymmetry a flat place axis can't express. For corpus-derived *vowel*
    evidence, the sources are Hirjee & Brown's learned similarity matrix
    (rap-rhyme-derived) and Bark-scaled formant data (perceptual, not
    rhyme-specific). What does hold: articulatory adjacency is not perceptual
    confusability — the IPA chart is a tongue-position diagram, and the
    standard perceptual embedding is Bark-scaled formant (F1/F2) space. The
    line of work is alive: McPherson & Ryan (2019) survey musical adaptation
    as phonological evidence
    (https://compass.onlinelibrary.wiley.com/doi/10.1111/lnc3.12359), and a
    2024 study extends imperfect-rhyme analysis to Chinese hip hop
    (https://www.degruyterbrill.com/document/doi/10.1515/lingvan-2024-0093/html).
  access_note: "Katz's Lingua page is abstract-only; the open repository copy has the text — cite the *Lingua* venue."
- key: rk
  tier: 2
  group: "The detection literature after 2010"
  title: "Unsupervised Discovery of Rhyme Schemes"
  cite: "Reddy & Knight · ACL · 2011"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["ACL Anthology", "https://aclanthology.org/P11-2014/"]
  why_this_one: >-
    The standard-cited paper for the task this repo calls "grouping." The
    scheme is a **latent variable** learned by EM from the corpus itself, with
    *no pronunciation dictionary at all*; its framing (a stanza's scheme as a
    structured object to infer, not a graph to component-ize) is the
    principled alternative to connected components. Read alongside Unit 10.
  covers: >-
    Group note: none of these three post-2010 lines invalidates the
    feature-based symbolic approach — they are mostly line-final-only, and
    Hirjee & Brown remain the only true task-peer for internal rap rhyme —
    but a research artifact must position itself against the field as it is.
    These three are the field.
- key: plechac
  tier: 2
  group: "The detection literature after 2010"
  title: "A Collocation-Driven Method of Discovering Rhymes"
  cite: "Plecháč · 2018"
  formats: [PAPER, CODE]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["Paper (ResearchGate)", "https://www.researchgate.net/publication/328847558"]
  - ["rhymetagger (GitHub)", "https://github.com/versotym/rhymetagger"]
  - ["2026 training-size study (arXiv)", "https://arxiv.org/abs/2604.08156"]
  why_this_one: >-
    Bootstraps rhyme pairs from end-of-line co-occurrence statistics, then
    trains on its own output; F ≈ 0.90–0.95 across seven languages, and
    still an active line (see the 2026 training-size study).
- key: haider
  tier: 2
  group: "The detection literature after 2010"
  title: "Supervised Rhyme Detection with Siamese Recurrent Networks"
  cite: "Haider & Kuhn · 2018"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["ACL Anthology", "https://aclanthology.org/W18-4509/"]
  why_this_one: >-
    ~97% pair-classification accuracy from raw *character* sequences, no
    phonetic features at all, evaluated partly on **hip-hop lyrics annotated
    for rhyme and assonance**. Doubly relevant: the neural baseline a
    symbolic pipeline should beat or match, and an existing annotation effort
    for Unit 14.
  covers: >-
    Their rhyme gold standard includes a hip-hop set annotated for rhyme
    *and* assonance — directly matching the project's north star; one of
    Unit 14's three external corpora.
- key: aline
  tier: 2
  title: "Kondrak's ALINE — the phonetic-alignment prior art"
  cite: "Kondrak · NAACL · 2000"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["A New Algorithm for the Alignment of Phonetic Sequences (PDF)", "https://webdocs.cs.ualberta.ca/~kondrak/papers/chum.pdf"]
  why_this_one: >-
    Unit 8's Needleman–Wunsch over vowel skeletons with feature-decomposed
    substitution costs is, almost exactly, ALINE — the standard
    phonetic-alignment algorithm for 25 years. Reinventing it was the right
    pedagogical call; read it afterward for credit and for the design answers
    it already worked out: per-feature **salience weights**, separate
    vowel/consonant treatment, and expansions/compressions for diphthongs —
    several questions the repo currently answers ad hoc.
- key: mcflow
  tier: 2
  group: "Evaluation corpora & the beat grid"
  title: "MCFlow: A Digital Corpus of Rap Transcriptions"
  cite: "Condit-Schultz · Empirical Musicology Review 11(2) · 2016"
  formats: [PAPER, DATA]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["Paper + corpus (Empirical Musicology Review)", "https://emusicology.org/article/id/4737/"]
  why_this_one: >-
    124 rap songs, 374 verses, ~6k measures, freely available, with rhythmic,
    prosodic, phonetic **and rhyme** annotations *including metric
    placement*. One dataset addresses both the Unit 14 evaluation gap and the
    prosody frontier (ledger items 5–6); its observed stress placements could
    even validate the scanner's inferred anchors directly.
  covers: "Unit 14 ground truth + beat-grid data."
  access_note: >-
    Content-safety caveat: the repo's fixture rule (no multi-line commercial
    lyrics) is in tension with evaluating on corpora of commercial rap.
    Evaluate locally against downloaded corpora; the harness should store
    **song IDs + offsets, never lyric text**.
- key: adams
  tier: 2
  group: "Evaluation corpora & the beat grid"
  title: "On the Metrical Techniques of Flow in Rap Music"
  cite: "Adams · Music Theory Online 15(5) · 2009"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["Music Theory Online", "https://mtosmt.org/issues/mto.09.15.5/mto.09.15.5.adams.html"]
  why_this_one: >-
    The music-theory side of the "performance context carries information a
    segment-only scanner cannot see" diagnosis.
- key: ohriner
  tier: 2
  group: "Evaluation corpora & the beat grid"
  title: "Flow: The Rhythmic Voice in Rap Music"
  cite: "Ohriner · Oxford UP · 2019"
  formats: [TEXT]
  verified_at: "2026-07"
  links:
  - ["Oxford UP", "https://global.oup.com/academic/product/flow-9780190670412"]
  why_this_one: >-
    The book-length computational treatment of rap prosody, including rhyme's
    interaction with meter. The prosody & flow frontier, anchored to names.
- key: llmphon
  tier: 2
  title: "LLMs and phonology — why a symbolic scanner matters in 2026"
  cite: "Suvarna et al. · 2024 — and the 2026 Greek rhyme hybrid"
  formats: [PAPER]
  cost: "free"
  free: true
  verified_at: "2026-07"
  links:
  - ["PhonologyBench (Suvarna et al. 2024)", "https://arxiv.org/html/2404.02456v2"]
  - ["Greek rhyme-detection/generation hybrid (2026)", "https://arxiv.org/pdf/2601.09631"]
  why_this_one: >-
    PhonologyBench shows LLMs working from orthographic tokens are *weak* at
    exactly the phoneme-level skills this pipeline implements symbolically;
    the hybrid systems show the emerging pattern — LLM fluency filtered
    through phonological machinery like this repo's. Together, the
    positioning claim in the README's "Where this sits in the field" section,
    with receipts.
- key: wiki
  tier: 2
  title: "Wikipedia, used well"
  cite: "the phonology articles"
  formats: [TEXT]
  cost: "free"
  free: true
  verified_at: "2026-06"
  links:
  - ["Sonority Sequencing Principle", "https://en.wikipedia.org/wiki/Sonority_Sequencing_Principle"]
  - ["Phonotactics", "https://en.wikipedia.org/wiki/Phonotactics"]
  - ["Syllable", "https://en.wikipedia.org/wiki/Syllable"]
  - ["ARPABET", "https://en.wikipedia.org/wiki/ARPABET"]
  why_this_one: >-
    Fast, accurate orientation for the phonology concepts the repo leans on
    (MOP, legal onsets, onset/nucleus/coda). Good enough for an engineer who
    needs the working idea, not a linguistics degree.

