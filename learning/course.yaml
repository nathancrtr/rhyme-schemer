resource_tiers:
- num: 1
  name: "The core path"
  role: "Read substantially. These four carry the course."
- num: 2
  name: "Deepening & alternatives"
  role: "Consult as a unit demands."
- num: 3
  name: "Reference & practice"
  compact: true
  role: "Look things up; read source."
- num: 4
  name: "Culture & motivation"
  role: "The \"why this is worth building\" tier."

units:
  - id: u0
    num: 0
    phase_body: true
    gloss: "Tests green locally; the pipeline and the north star in your own words."
  - {id: u1, num: 1, gloss: "Phonemes, ARPAbet, and the CMU lexicon — sound, not spelling."}
  - {id: u2, num: 2, gloss: "The IPA vowel space as coordinates; feature distance as graded similarity."}
  - {id: u3, num: 3, gloss: "Consonants: place, manner, voicing, sonority — the parallel plane."}
  - {id: u4, num: 4, gloss: "Syllables and the Maximal Onset Principle."}
  - {id: u5, num: 5, gloss: "The vowel skeleton and the rhyme-bearing tail from the last stress."}
  - {id: u6, num: 6, gloss: "Perfect rhyme as the threshold-1.0 special case."}
  - {id: u7, num: 7, gloss: "Graded slant rhyme: the kernel's nucleus/coda weighting."}
  - {id: u8, num: 8, gloss: "Needleman-Wunsch over vowel skeletons: unequal-length tails."}
  - {id: u9, num: 9, gloss: "Multi-word spans and pronunciation variants."}
  - {id: u10, num: 10, gloss: "Rhyme groups as connected components; transitivity imposed on a relation that lacks it."}
  - id: u11
    num: 11
    gloss: "Scanning a verse for internal and multisyllabic rhyme."
    note: >
      This unit's guide is the scanner walkthrough — written during the
      collaborative build, warts and wrong turns included, and it contains the
      project's living open tuning ledger. The Markdown file in
      interactive/lessons/ remains the engineering-canonical copy that code
      comments cite.
  - {id: u12, num: 12, gloss: "Rendering the scheme: color by rhyme class."}
  - {id: u13, num: 13, gloss: "Out-of-vocabulary words and the G2P fallback chain."}
  - {id: u14, num: 14, gloss: "Evaluation: gold annotation, corpora-first ground truth."}
  - {id: u15, num: 15, gloss: "Capstone: the finished tool plus the written understanding."}

materials:
  # Lessons
  - id: l-u01
    kind: lesson
    title: "Phonemes, not spelling"
    path: interactive/lessons/unit-01-phonemes-not-spelling.md
    unit: u1
    blurb: >-
      Say "Lincoln" and "reason" out loud, then look at their spellings — the
      lesson builds from that mismatch to why rhyme is a relation between
      sounds, with CMUdict and ARPAbet as the foundation everything else
      stands on.
  - id: l-u02
    kind: lesson
    title: "Feature distance"
    path: interactive/lessons/unit-02-feature-distance.md
    unit: u2
    blurb: >-
      Read vowel_distance as distance in a feature space — a hand-built
      embedding of 15 vowels. Keep the Vowel-Space Explorer open in another
      tab; every claim in the lesson is clickable there.
  - id: l-u03
    kind: lesson
    title: "Consonants"
    path: interactive/lessons/unit-03-consonants.md
    unit: u3
    blurb: >-
      Walk the consonant half of features.py as a deliberate parallel to the
      vowel space: place and sonority-ordered manner as the axes, voicing as
      a small weighted nudge you can feel with a finger on your throat.
  - id: l-u04
    kind: lesson
    title: "Syllables & phonotactics"
    path: interactive/lessons/unit-04-syllables-and-phonotactics.md
    unit: u4
    blurb: >-
      Trace how a flat CMUdict phoneme string becomes structured syllables —
      onset, nucleus, coda — and why the boundary the Maximal Onset Principle
      draws is a decision, not a discovery.
  - id: l-u05
    kind: lesson
    title: "The rhyme tail"
    path: interactive/lessons/unit-05-rhyme-tail.md
    unit: u5
    blurb: >-
      Work out why rhyme anchors at the last primary-stressed syllable —
      "lessen" and "strengthen" share a final syllable and don't rhyme —
      before you implement rhyme_tail in the exercise.
  - id: l-u06
    kind: lesson
    title: "Perfect rhyme first"
    path: interactive/lessons/unit-06-perfect-rhyme.md
    unit: u6
    blurb: >-
      Derive the equal-length scorer: nucleus and coda blended per syllable,
      onsets ignored, calibrated so identical tails score exactly 1.0. The
      floor Units 7 and 8 must reduce to.
  - id: l-u07
    kind: lesson
    title: "The rhyme kernel"
    path: interactive/lessons/unit-07-the-rhyme-kernel.md
    unit: u7
    blurb: >-
      Run your Unit 6 scorer on Lincoln/reason and confront the gap between
      the number and your ear; the lesson turns the score graded, with the
      weights read as approximations of perceptual similarity.
  - id: l-u08
    kind: lesson
    title: "Alignment"
    path: interactive/lessons/unit-08-alignment.md
    unit: u8
    blurb: >-
      Build Needleman-Wunsch over vowel skeletons, starting from a DP table
      you fill in by hand. The hardest unit in the course; go slow, and let a
      wall fall to a smaller table.
  - id: l-u09
    kind: lesson
    title: "Variants and spans"
    path: interactive/lessons/unit-09-variants-and-spans.md
    unit: u9
    blurb: >-
      See why a phrase needs no new type — a multi-word span is just a
      Pronunciation — and how taking the best score over CMUdict variants
      lets the rapper, not the dictionary, pick the reading.
  - id: l-u10
    kind: lesson
    title: "Non-transitivity"
    path: interactive/lessons/unit-10-non-transitivity.md
    unit: u10
    blurb: >-
      Examine what connected components commit you to when slant rhyme isn't
      an equivalence relation: grouping as a real modeling decision, with
      chaining as its named failure mode.
  - id: l-u11
    kind: lesson
    title: "Scanner walkthrough & tuning ledger"
    path: interactive/lessons/unit-11-scanner-walkthrough.md
    unit: u11
    blurb: >-
      Follow one demo verse through every stage of scan.py — candidates,
      matches, selection, grouping — as documented during the collaborative
      build, wrong turns included. Also home of the project's living tuning
      ledger.
  - id: l-u12
    kind: lesson
    title: "Rendering"
    path: interactive/lessons/unit-12-rendering.md
    unit: u12
    blurb: >-
      Separate rendering policy from pixels: why the renderer colors rhyme
      classes rather than vowels, and how RenderPlan makes every display
      decision data before the HTML and terminal backends execute it.
  - id: l-u13
    kind: lesson
    title: "G2P"
    path: interactive/lessons/unit-13-g2p.md
    unit: u13
    blurb: >-
      Learn the G2P fallback chain — dictionary, hand lexicon, dialect rules,
      letter-to-sound — why the links run in that order, and why the dialect
      rules are respectful recovery rather than normalization.
  # Companions (on-ramps)
  - id: c-phonetics
    kind: companion
    title: "How speech works: a phonetics refresher"
    path: interactive/lessons/phonetics-primer.md
    also_units: [u1]
    blurb: >-
      Rebuild the phonetics the project assumes in about twenty minutes,
      mostly by making sounds at your desk. Skim the ARPAbet table if your
      linguistics is fresh; read it all if it's fifteen years cold.
  - id: c-alignment
    kind: companion
    title: "The sequence-alignment family"
    path: interactive/lessons/sequence-alignment-family.md
    also_units: [u8]
    blurb: >-
      Place Unit 8's algorithm in its family — global alignment,
      seed-and-extend, co-linear chaining — and see why the same three ideas
      keep turning up in this repo. No biology assumed.
  - id: c-graphs
    kind: companion
    title: "Graphs, components, and union-find from zero"
    path: interactive/lessons/graphs-and-union-find.md
    also_units: [u10]
    blurb: >-
      Build graphs, connected components, and union-find from nothing, until
      you can read connected_components in rhyme.py line by line. Assumes no
      algorithms background.
  # Widgets
  - id: w-vowel
    kind: widget
    title: "Vowel-Space Explorer"
    path: interactive/widgets/vowel-explorer.html
    unit: u2
    blurb: >-
      Click pairs of vowels on the quadrilateral; the distance shown is
      exactly what vowel_distance() computes from the repo's own coordinates.
  - id: w-consonant
    kind: widget
    title: "Consonant-Space Explorer"
    path: interactive/widgets/consonant-explorer.html
    unit: u3
    blurb: >-
      Click pairs of consonants on the place-by-manner plane; the distance is
      exactly consonant_distance()'s number, voicing nudge included.
  - id: w-syllabifier
    kind: widget
    title: "Syllabifier"
    path: interactive/widgets/syllabifier.html
    unit: u4
    blurb: >-
      Watch the Maximal Onset Principle split a pronunciation into syllables
      — onset, nucleus, coda — and trace where each consonant lands and why.
  - id: w-sandbox
    kind: widget
    title: "Rhyme-Score Sandbox"
    path: interactive/widgets/rhyme-score-sandbox.html
    unit: u7
    also_units: [u9]
    blurb: >-
      Two words in, every receipt out: tails, alignment, per-column blend,
      and the final score — exactly the numbers rhyme_score() produces.
  - id: w-nw
    kind: widget
    title: "NW Alignment Explorer"
    path: interactive/widgets/nw-alignment.html
    unit: u8
    blurb: >-
      Step through the DP table as it fills, cell by cell, and watch the
      backtrace recover the alignment of two vowel skeletons, with the real
      vowel distances as substitution costs.
  - id: w-grouping
    kind: widget
    title: "Grouping Explorer"
    path: interactive/widgets/grouping-explorer.html
    unit: u10
    blurb: >-
      Slide the threshold over the demo verse's rhyme graph and watch edges
      appear and components merge — percolation and the cost of one generous
      edge, live.
  - id: w-annotator
    kind: widget
    title: "Gold Annotator"
    path: interactive/widgets/gold-annotator.html
    unit: u14
    blurb: >-
      Click words into rhyme groups to annotate a verse by ear; the widget
      writes the annotation in the tests/gold/ format the eval harness reads.
  # Quizzes
  - id: q-phase-1
    kind: quiz
    title: "Phase 1 checkpoint"
    path: interactive/quizzes/phase-1-checkpoint.html
    phase_num: 1
    blurb: >-
      Six questions on the phonetic foundation (Units 1-4). Click an answer
      and every option explains why it's right or wrong.
  - id: q-phase-2
    kind: quiz
    title: "Phase 2 checkpoint"
    path: interactive/quizzes/phase-2-checkpoint.html
    phase_num: 2
    blurb: >-
      Eight questions on the rhyme kernel (Units 5-8). Click an answer and
      every option explains why it's right or wrong.
  - id: q-phase-3
    kind: quiz
    title: "Phase 3 checkpoint"
    path: interactive/quizzes/phase-3-checkpoint.html
    phase_num: 3
    blurb: >-
      Seven questions on spans, variants, and grouping (Units 9-10). Click an
      answer and every option explains why it's right or wrong.
  - id: q-phase-4
    kind: quiz
    title: "Phase 4 checkpoint"
    path: interactive/quizzes/phase-4-checkpoint.html
    phase_num: 4
    blurb: >-
      Eight questions on rendering, G2P, and the evaluation concepts (Units
      12-13). Click an answer and every option explains why it's right or
      wrong.
  - id: b-questions
    kind: question-bank
    title: "Question bank"
    path: interactive/quizzes/question-bank.md
    blurb: >-
      The pool "quiz me on Phase N" draws from, organized by phase. Each
      question carries an answer and a one-line teaching note, so a wrong
      answer gets a real explanation, not just "no."
  # Exercises — graders per each exercise's own test style; the repo's suite
  # is the real grader in project-driven mode.
  - id: x-u05
    kind: exercise
    title: "unit-05-rhyme-tail"
    path: interactive/exercises/unit-05-rhyme-tail
    unit: u5
    grader: {type: unit-test, runner: python-unittest}
    blurb: >-
      Implement rhyme_tail — the slice from the last primary-stressed
      syllable to the end, with fallbacks for stress-less words. Copy the
      stub into the package and make the suite green.
  - id: x-u08
    kind: exercise
    title: "unit-08-alignment"
    path: interactive/exercises/unit-08-alignment
    unit: u8
    grader: {type: unit-test, runner: python-unittest}
    blurb: >-
      Fill in the two holes in alignment.py — the Needleman-Wunsch recurrence
      plus backtrace, and the gap-aware scorer — after working one small DP
      table by hand in task.md.
  - id: x-u10
    kind: exercise
    title: "unit-10-grouping"
    path: interactive/exercises/unit-10-grouping
    unit: u10
    grader: {type: unit-test, runner: python-unittest}
    blurb: >-
      Implement union-find connected components and the wrapper that turns
      pairwise scores plus a threshold into rhyme classes; one test makes you
      sign the modeling decision the unit is about.
  - id: x-u13
    kind: exercise
    title: "unit-13-g2p-extension"
    path: interactive/exercises/unit-13-g2p-extension
    unit: u13
    grader: {type: unit-test, runner: python-unittest}
    blurb: >-
      Three words the G2P chain currently gets wrong — "skrrt," "deadass,"
      "boutta." Fix each in the right link of the chain; choosing the link is
      the exercise.
